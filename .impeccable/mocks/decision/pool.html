<!doctype html><meta charset=utf-8><title>The Ripple Tank</title>
<style>html,body{margin:0;height:100%;background:#00A6E0;overflow:hidden;font-family:-apple-system,system-ui;color:#04203A}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.w{position:fixed;left:28px;right:28px;bottom:30px;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.02em;pointer-events:none}
.s{position:fixed;left:28px;top:26px;font-size:24px;font-weight:800;pointer-events:none}</style>
<canvas id=c></canvas><div class=s>You cut in</div><div class=w>Wait, have people skied down it?</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const S=3;let w,h,img;
function R(){w=c.width=Math.ceil(innerWidth/S);h=c.height=Math.ceil(innerHeight/S);img=x.createImageData(w,h)}R();onresize=R;
let you=[.3,.3],ai=[.72,.68];c.onclick=e=>{you=[e.clientX/innerWidth,e.clientY/innerHeight]};
function draw(t){const d=img.data,a=w/h;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=i/w,v=j/h;
  const d1=Math.hypot((u-you[0])*a,v-you[1]),d2=Math.hypot((u-ai[0])*a,v-ai[1]);
  const e1=(.6+.4*Math.sin(t*1.7))*Math.sin(d1*62-t*7)/(1+d1*3),e2=Math.sin(d2*48-t*5.5)/(1+d2*3);
  const n=e1+e2,k=Math.pow(Math.max(0,n*.5),5)*5,p=(i+j*w)*4;
  const warm=e1*e1/(e1*e1+e2*e2+.001);
  d[p]=Math.min(255,0+k*255+warm*95*Math.max(0,n));d[p+1]=Math.min(255,166+n*18+k*120);d[p+2]=Math.min(255,224+n*18+k*60-warm*80*Math.max(0,n));d[p+3]=255}
 x.putImageData(img,0,0);
 x.fillStyle='#FF5A1F';x.beginPath();x.arc(you[0]*w,you[1]*h,3.2,0,7);x.fill();
 x.fillStyle='#FFF23A';x.beginPath();x.arc(ai[0]*w,ai[1]*h,3.2,0,7);x.fill();
 requestAnimationFrame(n=>draw(n/1000))}
draw(0);
</script>
